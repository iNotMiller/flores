<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Mi mejor amiga</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<h1>Para ti Rouss <span>♥</span></h1>

<div class="stage">
<svg viewBox="0 0 400 580" role="img" aria-label="Ramo de flores amarillas con lazo rosa">
<defs>
<linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffa800"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
<linearGradient id="petal2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#fff6c4"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#ffb347"/><stop offset=".6" stop-color="#d9731a"/><stop offset="1" stop-color="#8a4210"/></radialGradient>
<linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0d7a5f"/><stop offset="1" stop-color="#4fd69a"/></linearGradient>
<linearGradient id="paperBack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4a6bb"/><stop offset="1" stop-color="#d9647f"/></linearGradient>
<linearGradient id="paperFront" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6e6"/><stop offset="1" stop-color="#ecd5b4"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0709a"/><stop offset="1" stop-color="#b8305a"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="bouquet"></g>
</svg>
</div>

<div class="quote">
<p id="frase" aria-live="polite"></p>
<button id="otra" type="button">Presioname</button>
</div>

<script src="script.js"></script>
</body>
</html>
